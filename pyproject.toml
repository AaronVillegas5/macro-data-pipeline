[tool.ruff]
# Set the maximum line length to 120 to avoid being overly strict
line-length = 120

[tool.ruff.lint]
# Select basic rules: pycodestyle (E, W) and Pyflakes (F)
select = ["E", "F", "W"]

# Explicitly ignore the strict pedantic rules that were causing failures
ignore = [
    "BLE001", # Do not catch blind exception: `Exception`
    "DTZ",    # flake8-datetimez (Naive datetimes)
    "S110",   # try-except-pass
    "G201",   # Logging .exception vs .error
    "RUF013", # PEP 484 implicit Optional
    "E402",   # Module level import not at top of file (needed for sys.path hacks)
    "E501",   # Line too long
    "W291",   # Trailing whitespace in multi-line strings
    "F841"    # Local variable is assigned to but never used
]
