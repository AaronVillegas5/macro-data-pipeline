version: 2

models:
  - name: stg_locations
    description: "Cleaned location dimension reference table."
    columns:
      - name: id
        description: "Primary key for location."
        tests:
          - unique
          - not_null
      - name: name
        description: "City name must not be null"
        tests:
          - not_null
      - name: latitude
        description: "Geographic latitude coordinate."
        tests:
          - not_null
      - name: longitude
        description: "Geographic longitude coordinate."
        tests:
          - not_null
  - name: stg_weather_observations
    description: "Daily weather observations including temperature and precipitation at various locations."
    columns:
      - name: location_id
        description: "Foreign key linking to stg_locations."
        tests:
          - not_null
      - name: observed_at
        description: "The timestamp when the weather was observed."
        tests:
          - not_null
      - name: observation_date
        description: "The date when the weather was observed (extracted from observed_at)."
      - name: temperature_c
        description: "The observed temperature in Celsius."
      - name: precipitation_mm
        description: "The observed precipitation in millimeters. Null values are coalesced to 0."
  - name: stg_economic_observations
    description: "Economic indicators over time."
    columns:
      - name: series_id
        description: "The ID of the economic indicator series (e.g., CPIAUCSL, UNRATE, GDP)."
        tests:
          - not_null
      - name: observed_at
        description: "The timestamp of the economic observation."
        tests:
          - not_null
      - name: value
        description: "The observed value of the economic indicator."
