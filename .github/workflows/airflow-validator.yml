name: Airflow DAG Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-dags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matching the Airflow container version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow==2.9.3
          pip install -r requirements.txt

      - name: Validate DAGs (Check for Import & Syntax Errors)
        run: |
          python -c "from airflow.models import DagBag; d = DagBag(dag_folder='dags/', include_examples=False); assert len(d.import_errors) == 0, f'DAG Import Errors: {d.import_errors}'"
        env:
          PYTHONPATH: ${{ github.workspace }}
