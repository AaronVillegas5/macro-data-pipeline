name: Airflow DAG Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-dags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matching the Airflow container version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow==2.9.3
          pip install -r requirements.txt

      - name: Validate DAGs (Check for Import & Syntax Errors)
        run: |
          # Initialize the database (required for Airflow CLI commands to work)
          airflow db migrate
          # Run the native Airflow command to check for DAG import errors
          airflow dags list-import-errors
        env:
          PYTHONPATH: ${{ github.workspace }}
          AIRFLOW_HOME: ${{ github.workspace }}
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
