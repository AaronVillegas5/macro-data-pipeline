name: Airflow DAG Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-dags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matching the Airflow container version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow==2.9.3
          pip install -r requirements.txt

      - name: Validate DAGs (Check for Import & Syntax Errors)
        run: |
          python -c "
          import os, sys, traceback, importlib.util
          dags_dir = 'dags/'
          sys.path.insert(0, dags_dir)
          errors = []
          for file in os.listdir(dags_dir):
              if file.endswith('.py') and not file.startswith('__'):
                  try:
                      filepath = os.path.join(dags_dir, file)
                      spec = importlib.util.spec_from_file_location(file[:-3], filepath)
                      module = importlib.util.module_from_spec(spec)
                      spec.loader.exec_module(module)
                  except Exception as e:
                      errors.append((file, traceback.format_exc()))
          if errors:
              for f, err in errors:
                  print(f'DAG Import Error in {f}:\n{err}')
              sys.exit(1)
          print('All DAGs imported successfully!')
          "
        env:
          PYTHONPATH: ${{ github.workspace }}
